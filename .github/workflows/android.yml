name: Android CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "build-tools;35.0.0"

      - name: Assemble debug and run unit tests
        run: ./gradlew assembleDebug testDebugUnitTest --stacktrace

      - name: Copy the installable APK
        run: cp app/build/outputs/apk/debug/app-debug.apk UU-Feed-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UU-Feed-debug
          path: UU-Feed-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: UU-Feed-debug.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
